/* Número secreto — adiviná con pistas de “más” y “menos”. */
(function () {

    montar: function (el, ctx) {
      var rango = 'Medio (1 a 100)';

        el.innerHTML = ''; var sel = h('div', { class: 'sel', role: 'group', 'aria-label': 'Rango' });

      }
