<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Creá tu usuario — VAMA Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap">
<link rel="stylesheet" href="/assets/vama.css?v=20261028">
</head><body>
<header class="top"><div class="wrap"><a class="brand" href="/" target="_blank" rel="noopener"><img src="/img/vama-academy-logo.png" alt="VAMA Academy" width="198" height="22"></a><a class="link" href="/cursos/" target="_blank" rel="noopener">Ya tengo usuario</a></div></header>
<main class="wrap"><div class="card narrow">
  <p class="eyebrow">Tu acceso</p>
  <h1 class="serif">Creá tu usuario</h1>
  <p class="muted">Elegí una contraseña para entrar a tu acceso cuando quieras.</p>
  <p class="msg err" id="err" hidden></p>
  <form id="f" novalidate>
    <div class="row2">
      <div class="field"><label for="nombre">Nombre</label><input id="nombre" type="text" autocomplete="given-name" required></div>
      <div class="field"><label for="apellido">Apellido</label><input id="apellido" type="text" autocomplete="family-name" required></div>
    </div>
    <div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required readonly></div>
    <div class="field"><label for="pass">Contraseña (mínimo 8 caracteres)</label><input id="pass" type="password" autocomplete="new-password" required></div>
    <div class="field"><label for="pass2">Repetí la contraseña</label><input id="pass2" type="password" autocomplete="new-password" required></div>
    <button class="cta block" type="submit" id="btn">Crear mi usuario</button>
  </form>
  <div id="ok" hidden><p class="msg okk" id="okmsg"></p><a class="cta block" href="/cursos/" target="_blank" rel="noopener">Entrar a mi acceso</a></div>
</div></main>
<footer class="foot">Contenido educativo. No constituye asesoramiento financiero.<br>¿Necesitás ayuda? <a href="mailto:hola@vamatienda.com.ar">hola@vamatienda.com.ar</a></footer>
<script src="/assets/vama.js?v=20261028"></script>
<script>
var q = new URLSearchParams(location.search), $ = function (i) { return document.getElementById(i); };
var token = q.get('token') || '', mail = q.get('email') || '';
$('email').value = mail;
function error(t) { $('err').textContent = t; $('err').hidden = false; }
function reset() { $('btn').disabled = false; $('btn').textContent = 'Crear mi usuario'; }
if (!token || !mail) { $('f').hidden = true; error('El link está incompleto. Abrí de nuevo el link del email de compra.'); }
$('f').addEventListener('submit', function (e) {
  e.preventDefault(); $('err').hidden = true;
  var nombre = $('nombre').value.trim(), apellido = $('apellido').value.trim(), p = $('pass').value;
  if (nombre.length < 2 || apellido.length < 2) return error('Completá tu nombre y apellido.');
  if (p.length < 8) return error('La contraseña tiene que tener al menos 8 caracteres.');
  if (p !== $('pass2').value) return error('Las contraseñas no coinciden.');
  $('btn').disabled = true; $('btn').textContent = 'Creando…';
  VAMA.api('/auth/register', { method: 'POST', body: { reg_token: token, nombre: nombre, apellido: apellido, email: mail, password: p } }).then(function (r) {
    if (r.ok) { $('f').hidden = true; $('ok').hidden = false; $('okmsg').textContent = r.data.message || '¡Cuenta creada! Ya podés iniciar sesión.'; }
    else { error(r.data.error || 'No pudimos crear tu usuario.'); reset(); }
  }).catch(function () { error('Error de conexión. Intentá de nuevo.'); reset(); });
});
</script>
</body></html>
