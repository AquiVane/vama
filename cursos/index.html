<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Mis cursos — VAMA Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap">
<link rel="stylesheet" href="/assets/vama.css">
<style>
.prog{height:8px;background:var(--line);border-radius:99px;overflow:hidden;margin:6px 0 16px}.prog i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .3s}
details.les{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:10px}
details.les summary{cursor:pointer;list-style:none;padding:16px 18px;display:flex;gap:12px;align-items:center;font-weight:700;color:var(--dark)}
details.les summary::-webkit-details-marker{display:none}
details.les .et{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--acc);white-space:nowrap}
details.les .ck{margin-left:auto;font-size:18px}
details.les .lb{padding:0 18px 18px}
.ej{background:var(--light);border-radius:14px;padding:16px 18px;margin:14px 0}.ej h3{margin:0 0 12px;font-size:18px;color:var(--dark)}
.ej-chk{display:flex;gap:10px;align-items:flex-start;margin:0 0 10px;font-weight:400;font-size:16px}.ej-chk input{margin-top:4px;width:20px;height:20px;flex:none;accent-color:var(--acc)}
.ej select,.ej input[type=month],.ej input[type=date]{font:inherit;font-size:16px;padding:14px;border:1.5px solid #C9D3CE;border-radius:12px;width:100%;background:#fff;color:var(--ink)}
.ej .card{padding:12px 14px}.ej .card small{color:var(--muted)}
.app-card{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap}.app-card>div{min-width:0;flex:1 1 240px}
details.les .lb table{display:block;max-width:100%;overflow-x:auto;border-collapse:collapse}details.les .lb th,details.les .lb td{padding:8px 10px;border:1px solid var(--line);text-align:left;vertical-align:top;font-size:15px}details.les .lb .box{background:var(--light);border-radius:12px;padding:12px 16px;margin:12px 0}
.tarea{background:var(--light);border-radius:12px;padding:12px 14px;margin:0 0 14px;color:var(--dark)}
@media (max-width:600px){details.les summary{flex-wrap:wrap}}
</style>
</head><body>
<header class="top"><div class="wrap"><a class="brand" href="/"><img src="/img/vama-academy-logo.png" alt="VAMA Academy" width="198" height="22"></a><button class="link" id="salir" type="button" hidden style="background:none;cursor:pointer;font-family:inherit">Salir</button></div></header>
<main class="wrap"><div id="login" class="card narrow" hidden>
  <p class="eyebrow">Mis cursos</p>
  <h1 class="serif">Ingresá</h1>
  <p class="msg err" id="lerr" hidden></p>
  <form id="lf" novalidate>
    <div class="field"><label for="lemail">Email</label><input id="lemail" type="email" autocomplete="email" required></div>
    <div class="field"><label for="lpass">Contraseña</label><input id="lpass" type="password" autocomplete="current-password" required></div>
    <button class="cta block" type="submit" id="lbtn">Entrar</button>
  </form>
  <p style="margin:16px 0 0;text-align:center"><a href="#" id="olvide">Olvidé mi contraseña</a></p>
  <p class="msg okk" id="fmsg" hidden style="margin-top:16px"></p>
</div>
<div id="area" hidden>
  <p class="eyebrow">Mi acceso</p>
  <h1 class="serif" id="hola">Mis cursos</h1>
  <p class="muted">Acá tenés todo lo que compraste, ordenado por módulos. Los archivos se descargan solo con tu usuario.</p>
  <p class="msg err" id="aerr" hidden></p>
  <div id="items"></div>
</div></main>
<footer class="foot">Contenido educativo. No constituye asesoramiento financiero.<br>¿Necesitás ayuda? <a href="mailto:hola@vamatienda.com.ar">hola@vamatienda.com.ar</a></footer>
<script src="/assets/vama.js"></script>
<script src="/assets/ejercicios.js"></script>
<script>
var $ = function (i) { return document.getElementById(i); };
var ICON = { xlsx: '📊', pdf: '📘', mp4: '🎬' };
var INFO = {
  'planilla-ejemplos': 'La planilla con datos de ejemplo cargados, para ver cómo funciona todo. Para usarla en Google Sheets: descargala, subila a tu Google Drive, abrila con Hojas de cálculo de Google y elegí Archivo › Guardar como Hojas de cálculo de Google. También funciona directo en Excel.',
  'planilla-blanco': 'La misma planilla sin datos, lista para cargar la tuya. Se usa igual en Google Sheets (subila a Drive) o en Excel.',
  guia: 'Tu plan día por día para ordenar tu plata en una semana.',
  tutorial: 'Un recorrido de 2 minutos por la planilla.',
  libro: 'El libro completo en PDF, para leer o descargar.',
  fondo: 'Tu bonus: 12 semanas, una acción por semana, para armar tu fondo de emergencia.'
};
var MODULOS = [
  { t: 'Módulo 1 · Empezá acá', ids: ['tutorial'] },
  { t: 'Módulo 2 · Tu planilla', ids: ['planilla-ejemplos', 'planilla-blanco'] },
  { t: 'Módulo 3 · Guía: Ordená tu plata en 7 días (lecciones)', ids: ['guia'] },
  { t: 'Bonus · Plan de 90 días para tu fondo de emergencia', ids: ['fondo'] }
];
function vista(logueado) { $('login').hidden = logueado; $('area').hidden = !logueado; $('salir').hidden = !logueado; }
function msg(id, t) { $(id).textContent = t; $(id).hidden = false; }

// Descarga con la sesión: el archivo pago nunca tiene un link público.
function bajar(it, btn, modo) {
  var t = VAMA.store('vama_token'), orig = btn.textContent;
  btn.disabled = true; btn.textContent = 'Preparando…'; $('aerr').hidden = true;
  return fetch(VAMA.cfg.CORE + '/academy/archivo/' + it.curso + '/' + it.id, { headers: { Authorization: 'Bearer ' + t } }).then(function (r) {
    if (r.status === 401) { salir(); throw new Error('sesion'); }
    if (!r.ok) throw new Error('No pudimos descargar el archivo. Intentá de nuevo.');
    return r.blob();
  }).then(function (b) {
    var url = URL.createObjectURL(b);
    if (modo === 'ver') { var v = document.getElementById('v-' + it.id); v.src = url; v.hidden = false; v.play(); }
    else { var a = document.createElement('a'); a.href = url; a.download = it.nombre.replace(/[^\w\- ]+/g, '').trim().replace(/\s+/g, '-') + '.' + it.tipo; document.body.appendChild(a); a.click(); a.remove(); }
  }).catch(function (e) { if (e.message !== 'sesion') msg('aerr', e.message); })
    .then(function () { btn.disabled = false; btn.textContent = orig; });
}

function tarjeta(it) {
  var d = document.createElement('div'); d.className = 'card'; d.style.marginBottom = '12px';
  d.innerHTML = '<h2>' + (ICON[it.tipo] || '📄') + ' <span class="t"></span></h2><p class="muted i"></p><div class="acc"></div>';
  d.querySelector('.t').textContent = it.nombre;
  d.querySelector('.i').textContent = INFO[it.id] || '';
  var acc = d.querySelector('.acc');
  if (!it.disponible) { acc.innerHTML = '<p class="msg warn" style="margin:0">Este archivo se está preparando. Escribinos a hola@vamatienda.com.ar si en unas horas todavía no está.</p>'; return d; }
  var b = document.createElement('button'); b.type = 'button'; b.className = 'cta'; b.textContent = 'Descargar'; b.onclick = function () { bajar(it, b, 'bajar'); }; acc.appendChild(b);
  if (it.tipo === 'mp4') {
    var w = document.createElement('button'); w.type = 'button'; w.className = 'cta ghost'; w.style.marginLeft = '10px'; w.textContent = 'Ver ahora'; w.onclick = function () { bajar(it, w, 'ver'); }; acc.appendChild(w);
    var v = document.createElement('video'); v.id = 'v-' + it.id; v.controls = true; v.hidden = true; v.playsInline = true; v.style.cssText = 'width:100%;max-width:720px;margin-top:16px;border-radius:12px;display:block'; acc.appendChild(v);
  }
  return d;
}

function esc(t) { return String(t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function rich(t) { return esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>'); }

// Lecciones (texto pago: viene del Worker, con sesión). Sirve para la guía de 7 días (cuerpo en párrafos)
// y para "Tus dólares, bien puestos" (cuerpo en HTML + ejercicios completables).
function pintarLecciones(cont, lec, extra) {
  var hechas = lec.hechas.slice(), curso = lec.curso, idDe = function (l) { return l.id || ('l' + l.n); };
  var wrap = document.createElement('div');
  var total = lec.lecciones.length, pid = 'p' + curso.replace(/[^a-z]/g, '');
  if (lec.aviso) { var av = document.createElement('p'); av.className = 'msg warn'; av.textContent = lec.aviso; wrap.appendChild(av); }
  var barra = document.createElement('div'); barra.innerHTML = '<p class="muted" style="margin:0" id="' + pid + '-t"></p><div class="prog"><i id="' + pid + '-b"></i></div>';
  wrap.appendChild(barra);
  function progreso() { $(pid + '-t').textContent = hechas.length + ' de ' + total + ' lecciones completadas'; $(pid + '-b').style.width = Math.round(hechas.length * 100 / total) + '%'; }
  lec.lecciones.forEach(function (l) {
    var lid = idDe(l);
    var d = document.createElement('details'); d.className = 'les';
    var sm = document.createElement('summary');
    sm.innerHTML = '<span class="et"></span><span class="tt"></span><span class="ck" aria-hidden="true"></span>';
    sm.querySelector('.et').textContent = l.etiqueta || ('Lección ' + l.n); sm.querySelector('.tt').textContent = l.titulo;
    var body = document.createElement('div'); body.className = 'lb';
    if (l.html) body.innerHTML = l.html;   // contenido propio, viene del Worker
    else body.innerHTML = l.cuerpo.map(function (p) { return '<p>' + rich(p) + '</p>'; }).join('') + (l.tarea ? '<p class="tarea"><b>Tarea:</b> ' + esc(l.tarea) + '</p>' : '');
    if (l.ejercicio) {
      var eb = document.createElement('div'); body.appendChild(eb);
      VAMA_EJ.render(eb, l.ejercicio, l.n, (lec.ejercicios || {})[l.n], function (datos, mes) {
        VAMA.api('/academy/ejercicio', { method: 'POST', auth: true, body: { curso: curso, n: l.n, datos: datos, mes: mes } }).catch(function () {});
      });
    }
    var b = document.createElement('button'); b.type = 'button'; b.className = 'cta'; b.style.marginTop = '8px';
    function marca() { var h = hechas.indexOf(lid) >= 0; sm.querySelector('.ck').textContent = h ? '✅' : ''; b.textContent = h ? 'Marcar como pendiente' : 'Marcar como hecha'; b.className = (h ? 'cta ghost' : 'cta'); }
    b.onclick = function () {
      var hecha = hechas.indexOf(lid) < 0; b.disabled = true;
      VAMA.api('/academy/leccion', { method: 'POST', auth: true, body: { curso: curso, id: lid, hecha: hecha } }).then(function (r) {
        if (r.ok) hechas = r.data.hechas; marca(); progreso();
      }).catch(function () {}).then(function () { b.disabled = false; });
    };
    body.appendChild(b); d.appendChild(sm); d.appendChild(body); wrap.appendChild(d); marca();
  });
  cont.appendChild(wrap); progreso();
  if (extra) cont.appendChild(tarjeta(extra));
}

function pintar(data, lec, libro) {
  vista(true);
  $('hola').textContent = data.nombre ? 'Hola, ' + data.nombre : 'Mis cursos';
  var cont = $('items'); cont.innerHTML = '';
  var porId = {}; data.items.forEach(function (it) { porId[it.id] = it; });
  var tienePlata = data.items.some(function (it) { return it.curso === 'plata-en-orden'; });
  if (tienePlata) {
    var ap = document.createElement('div'); ap.className = 'card app-card'; ap.style.marginBottom = '12px';
    ap.innerHTML = '<div><h2>📱 App Plata en Orden</h2><p class="muted" style="margin:0">Cargá cada gasto desde el celu en 5 segundos y mirá cuánto te queda del mes. Entrás con el mismo usuario y contraseña. <a href="/app/tutorial-instalar-app.pdf" target="_blank" rel="noopener" style="color:inherit;text-decoration:underline">Cómo instalarla en tu celu (PDF)</a></p></div><a class="cta" href="/app/">Descargar la app</a>';
    cont.appendChild(ap);
    var gs = document.createElement('div'); gs.className = 'card'; gs.style.marginBottom = '12px';
    gs.innerHTML = '<details><summary style="cursor:pointer;font-weight:700">Usar tu planilla en Google Sheets</summary><p class="muted">Necesitás una cuenta de Gmail (la misma con la que entrás a Google Drive).</p><ol><li>Descargá la planilla (con ejemplos o en blanco) desde Mis recursos.</li><li>Entrá a drive.google.com con tu Gmail.</li><li>Tocá “+ Nuevo” → “Subir archivo” y elegí el Excel que descargaste.</li><li>Abrí el archivo ya subido y tocá Archivo → “Guardar como hoja de cálculo de Google”.</li><li>Listo: la editás desde el celu o la compu y se guarda sola.</li></ol><p class="muted"><b>Importante:</b> si solo abrís el Excel en Drive sin guardarlo como hoja de cálculo de Google, algunas fórmulas pueden no funcionar.</p></details>';
    cont.appendChild(gs);
  }
  MODULOS.forEach(function (m) {
    var its = m.ids.map(function (i) { return porId[i]; }).filter(Boolean);
    if (!its.length) return;
    var h = document.createElement('p'); h.className = 'eyebrow'; h.style.margin = '28px 0 12px'; h.textContent = m.t; cont.appendChild(h);
    if (m.ids[0] === 'guia' && lec) pintarLecciones(cont, lec, porId.guia); else its.forEach(function (it) { cont.appendChild(tarjeta(it)); });
  });
  if (porId.libro) {
    var hl = document.createElement('p'); hl.className = 'eyebrow'; hl.style.margin = '28px 0 12px'; hl.textContent = 'Tus dólares, bien puestos'; cont.appendChild(hl);
    if (libro) pintarLecciones(cont, libro, porId.libro); else cont.appendChild(tarjeta(porId.libro));
  }
}

function cargar() {
  VAMA.api('/academy/archivos', { auth: true }).then(function (r) {
    if (r.status === 401) { salir(); return; }
    if (!r.ok) { vista(true); msg('aerr', 'No pudimos cargar tus archivos. Recargá la página.'); return; }
    // Lecciones: si fallan, queda la guía en PDF como recurso descargable.
    var tieneLibro = r.data.items.some(function (it) { return it.curso === 'tus-dolares-bien-puestos'; });
    Promise.all([VAMA.api('/academy/lecciones?curso=plata-en-orden', { auth: true }), tieneLibro ? VAMA.api('/academy/lecciones?curso=tus-dolares-bien-puestos', { auth: true }) : Promise.resolve(null)])
      .then(function (L) { pintar(r.data, L[0].ok && L[0].data.lecciones ? L[0].data : null, L[1] && L[1].ok && L[1].data.lecciones ? L[1].data : null); })
      .catch(function () { pintar(r.data, null, null); });
  }).catch(function () { vista(true); msg('aerr', 'Error de conexión. Recargá la página.'); });
}
function salir() {
  if (VAMA.store('vama_token')) VAMA.api('/auth/logout', { method: 'POST', auth: true }).catch(function () {});
  VAMA.store('vama_token', null); vista(false);
}
$('salir').addEventListener('click', salir);

$('lf').addEventListener('submit', function (e) {
  e.preventDefault(); $('lerr').hidden = true;
  var mail = $('lemail').value.trim().toLowerCase(), p = $('lpass').value;
  if (!VAMA.emailOk(mail) || !p) return msg('lerr', 'Completá tu email y tu contraseña.');
  $('lbtn').disabled = true; $('lbtn').textContent = 'Entrando…';
  VAMA.api('/auth/login', { method: 'POST', body: { email: mail, password: p } }).then(function (r) {
    if (r.ok && r.data.token) { VAMA.store('vama_token', r.data.token); $('lpass').value = ''; cargar(); }
    else msg('lerr', r.data.error || 'Email o contraseña incorrectos.');
  }).catch(function () { msg('lerr', 'Error de conexión. Intentá de nuevo.'); })
    .then(function () { $('lbtn').disabled = false; $('lbtn').textContent = 'Entrar'; });
});
$('olvide').addEventListener('click', function (e) {
  e.preventDefault(); $('lerr').hidden = true;
  var mail = $('lemail').value.trim().toLowerCase();
  if (!VAMA.emailOk(mail)) return msg('lerr', 'Escribí tu email arriba y volvé a tocar "Olvidé mi contraseña".');
  VAMA.api('/auth/forgot', { method: 'POST', body: { email: mail } }).then(function () {
    msg('fmsg', 'Si el email tiene cuenta, te llega un link para crear una contraseña nueva en unos minutos.');
  }).catch(function () { msg('lerr', 'Error de conexión. Intentá de nuevo.'); });
});

if (VAMA.store('vama_token')) cargar(); else vista(false);
</script>
</body></html>
