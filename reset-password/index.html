<!doctype html>
<html lang="es"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Nueva contraseña — VAMA Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=DM+Serif+Display&display=swap">
<link rel="stylesheet" href="/assets/vama.css">
</head><body>
<header class="top"><div class="wrap"><a class="brand" href="/">VAMA ACADEMY</a></div></header>
<main class="wrap"><div class="card narrow">
  <h1 class="serif">Nueva contraseña</h1>
  <p class="msg err" id="err" hidden></p>
  <form id="f" novalidate>
    <div class="field"><label for="pass">Nueva contraseña (mínimo 8 caracteres)</label><input id="pass" type="password" autocomplete="new-password" required></div>
    <div class="field"><label for="pass2">Repetila</label><input id="pass2" type="password" autocomplete="new-password" required></div>
    <button class="cta block" type="submit" id="btn">Guardar contraseña</button>
  </form>
  <div id="ok" hidden><p class="msg okk">¡Listo! Tu contraseña fue actualizada.</p><a class="cta block" href="/plata-en-orden/acceso/">Entrar a mi acceso</a></div>
</div></main>
<footer class="foot">Contenido educativo. No constituye asesoramiento financiero.<br>¿Necesitás ayuda? <a href="mailto:hola@vamatienda.com.ar">hola@vamatienda.com.ar</a></footer>
<script src="/assets/vama.js"></script>
<script>
var token = new URLSearchParams(location.search).get('token') || '', $ = function (i) { return document.getElementById(i); };
function error(t) { $('err').textContent = t; $('err').hidden = false; }
if (!token) { $('f').hidden = true; error('El link está incompleto. Pedí uno nuevo desde "Olvidé mi contraseña".'); }
$('f').addEventListener('submit', function (e) {
  e.preventDefault(); $('err').hidden = true;
  var p = $('pass').value;
  if (p.length < 8) return error('La contraseña tiene que tener al menos 8 caracteres.');
  if (p !== $('pass2').value) return error('Las contraseñas no coinciden.');
  $('btn').disabled = true;
  VAMA.api('/auth/reset', { method: 'POST', body: { token: token, newPassword: p } }).then(function (r) {
    if (r.ok) { $('f').hidden = true; $('ok').hidden = false; }
    else { error(r.data.error || 'El link venció. Pedí uno nuevo.'); $('btn').disabled = false; }
  }).catch(function () { error('Error de conexión. Intentá de nuevo.'); $('btn').disabled = false; });
});
</script>
</body></html>
